name: Release

# HACS offers only GitHub releases once a repository has any, so every version
# that reaches main needs one. When manifest.json's version changes on main,
# this publishes release vX.Y.Z at that commit. A version that already has a
# release is left alone, so re-runs and unrelated manifest edits do nothing.
on:
  push:
    branches: [main]
    paths:
      - custom_components/june_oven/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    # No actions, only the runner's gh and python3: the repository allows
    # only prj-july actions pinned to a commit, so even actions/checkout is
    # refused. The manifest is read through the API at the pushed commit.
    steps:
      - name: Read the integration version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/custom_components/june_oven/manifest.json?ref=$GITHUB_SHA" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish the release if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
